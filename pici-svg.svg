<svg width="900" height="330" viewBox="0 0 900 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Основной фон -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111522" />
      <stop offset="100%" stop-color="#161428" />
    </linearGradient>

    <!-- Неоновые пятна по краям -->
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 90) scale(280 220)">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 240) scale(300 220)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Градиент для ника -->
    <linearGradient id="nickGrad" x1="35" y1="0" x2="210" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Нижняя неоновая линия -->
    <linearGradient id="lineGrad" x1="35" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#161428" stop-opacity="0" />
    </linearGradient>

    <!-- Сетка на фоне -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Подложка -->
  <rect width="900" height="330" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  <rect width="900" height="330" rx="16" fill="url(#grid)" />
  <rect width="900" height="330" rx="16" fill="url(#cyanGlow)" />
  <rect width="900" height="330" rx="16" fill="url(#purpleGlow)" />

  <!-- Ник и слоган -->
  <text x="36" y="72" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#nickGrad)" letter-spacing="-0.5">olilexeo</text>
  <text x="192" y="70" font-family="&#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, Consolas, monospace" font-size="14" fill="#8b949e">/  just a tech</text>

  <!-- Бейджи справа -->
  <g transform="translate(555, 46)">
    <rect width="128" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#2ea043" />
    <text x="28" y="18" font-family="&#39;JetBrains Mono&#39;, Consolas, monospace" font-size="11.5" fill="#c9d1d9">just a tech</text>
  </g>

  <g transform="translate(693, 46)">
    <rect width="171" height="28" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="85.5" y="18" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;, Consolas, monospace" font-size="11.5" fill="#c9d1d9">c++ · rust · python</text>
  </g>

  <!-- Окно терминала -->
  <rect x="36" y="102" width="828" height="190" rx="10" fill="#090c10" stroke="#21262d" stroke-width="1.5" />
  
  <!-- Шапка терминала -->
  <path d="M 37 112 Q 37 103 46 103 L 854 103 Q 863 103 863 112 L 863 130 L 37 130 Z" fill="#161b22" />
  <line x1="36" y1="130" x2="864" y2="130" stroke="#21262d" stroke-width="1" />
  
  <!-- Кнопки macOS -->
  <circle cx="54" cy="116.5" r="5" fill="#ff5f56" />
  <circle cx="71" cy="116.5" r="5" fill="#ffbd2e" />
  <circle cx="88" cy="116.5" r="5" fill="#27c93f" />
  <text x="846" y="120" text-anchor="end" font-family="&#39;JetBrains Mono&#39;, Consolas, monospace" font-size="11" fill="#484f58">bash — 80×24</text>

  <!-- Текст внутри терминала -->
  <g font-family="&#39;JetBrains Mono&#39;, &#39;Fira Code&#39;, Consolas, monospace" font-size="13.5">
    <!-- Строка 1 -->
    <text x="54" y="156">
      <tspan fill="#3fb950">olilexeo@gh</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">whoami</tspan>
    </text>
    <text x="54" y="177" fill="#9ea7b3">olilexeo — just a tech. former python backend developer.</text>

    <!-- Строка 2 -->
    <text x="54" y="203">
      <tspan fill="#3fb950">olilexeo@gh</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">cat stack.txt</tspan>
    </text>
    <text x="54" y="224" fill="#9ea7b3">c++ · rust — and python from the past</text>

    <!-- Строка 3 -->
    <text x="54" y="250">
      <tspan fill="#3fb950">olilexeo@gh</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#e6edf3">echo $STATUS</tspan>
    </text>
    <text x="54" y="271" fill="#9ea7b3">exploring low-level systems & building things for fun.</text>

    <!-- Строка 4 (курсор) -->
    <text x="54" y="284">
      <tspan fill="#3fb950">olilexeo@gh</tspan><tspan fill="#8b949e">:~$ </tspan>
    </text>
    <rect x="172" y="273" width="8" height="13" fill="#38bdf8" />
  </g>

  <!-- Нижняя градиентная полоска -->
  <line x1="36" y1="312" x2="480" y2="312" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" />
</svg>